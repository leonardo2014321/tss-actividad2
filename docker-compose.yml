# Aplicación + PostgreSQL con almacenamiento persistente.
#   docker compose up --build
# Los datos viven en el volumen "pgdata": sobreviven a reinicios y a "docker compose down" (no uses "-v" si quieres conservarlos).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: arcusur
      POSTGRES_USER: arcusur
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cambia-esta-clave}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcusur -d arcusur"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/arcusur
      DB_USER: arcusur
      DB_PASSWORD: ${DB_PASSWORD:-cambia-esta-clave}
    ports:
      - "8080:8080"
volumes:
  pgdata:

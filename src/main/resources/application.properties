# Base de datos H2 guardada en la carpeta ./data (no requiere instalar nada).
spring.datasource.url=jdbc:h2:file:./data/arcusur;AUTO_SERVER=TRUE
# update: crea las tablas si no existen y agrega columnas nuevas sin borrar datos.
spring.jpa.hibernate.ddl-auto=update
# Puerto del servidor: la aplicación se abre en http://localhost:8080
server.port=8080
# Muestra en las respuestas de error el mensaje y las validaciones fallidas (útil al desarrollar).
server.error.include-message=always
server.error.include-binding-errors=always

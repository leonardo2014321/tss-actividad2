# ---------------------------------------------------------------------------
# Base de datos persistente
# Por defecto: H2 en la carpeta ./data (archivo; los datos sobreviven a los reinicios).
# Para PostgreSQL (recomendado en un servidor o en la nube) define estas variables de entorno:
#   DB_URL=jdbc:postgresql://localhost:5432/arcusur   DB_USER=arcusur   DB_PASSWORD=...
# Con docker compose (ver docker-compose.yml) ya queda configurado.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/arcusur;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
# update: crea las tablas si no existen y agrega columnas nuevas sin borrar datos.
spring.jpa.hibernate.ddl-auto=update
# Las reglas de validación (obligatorios, rangos) se aplican en el servidor; no se copian como NOT NULL a las columnas,
# así se pueden agregar columnas nuevas a una base que ya tiene respuestas.
spring.jpa.properties.hibernate.validator.apply_to_ddl=false
# Puerto del servidor: la aplicación se abre en http://localhost:8080
server.port=${PORT:8080}
# Muestra en las respuestas de error el mensaje y las validaciones fallidas (el formulario lo usa para avisar de un correo repetido).
server.error.include-message=always
server.error.include-binding-errors=always
# Clave de administración (opcional). Si la defines, consultar, editar y eliminar respuestas desde el panel
# pide esta clave. Déjala vacía solo para uso local; en un servidor público siempre defínela.
admin.clave=${ADMIN_CLAVE:}
